  <!-- Preloads the scene that actually matches the visitor's local time, instead of
       always preloading "day". Keep the segments below in sync with sky.js. -->
  <script>
    (function () {
      var minute = new Date().getHours() * 60 + new Date().getMinutes();
      var segments = [
        [0, 310, 'night', 'night'], [310, 405, 'night', 'dawn'], [405, 495, 'dawn', 'day'],
        [495, 975, 'day', 'day'], [975, 1060, 'day', 'golden'], [1060, 1150, 'golden', 'dusk'],
        [1150, 1245, 'dusk', 'night'], [1245, 1440, 'night', 'night']
      ];
      var scene = 'day';
      for (var i = 0; i < segments.length; i++) {
        var s = segments[i];
        if (minute >= s[0] && minute < s[1]) {
          scene = ((minute - s[0]) / (s[1] - s[0])) < 0.5 ? s[2] : s[3];
          break;
        }
      }
      [['(min-width: 761px)', ''], ['(max-width: 760px)', '-mobile']].forEach(function (pair) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.media = pair[0];
        link.href = './assets/sky/' + scene + '-premium-v3' + pair[1] + '.webp';
        document.head.appendChild(link);
      });
    })();
  </script>
